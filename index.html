<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>우리집 가계부 — 부부 재정 관리 대시보드</title>

  <!-- 홈 화면에 추가하면 앱처럼 실행됩니다 (PWA) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="application-name" content="우리집 가계부" />

  <!-- iOS: 홈 화면 아이콘 & 전체화면 실행 -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="우리집 가계부" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- 브라우저 탭 아이콘 -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- 한글 전용 폰트: Plus Jakarta Sans 에는 한글 글리프가 없어 시스템 폰트로 폴백됩니다 -->
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  
  <!-- Chart.js CDN for interactive financial graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase Cloud DB & Realtime Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-logo">
        <span class="logo-icon">💑</span>
        <h1 class="brand-title">우리집 가계부</h1>
        <span class="cloud-badge" id="cloud-sync-badge" title="실시간 부부 동기화 연결됨">☁️ 실시간 연동</span>
      </div>
    </div>

    <!-- Month Navigation Bar -->
    <div class="month-selector">
      <button class="btn-month-nav" id="btn-prev-month" title="이전 달">&lt;</button>
      <div class="current-month-display" id="display-current-month">&nbsp;</div>
      <button class="btn-month-nav" id="btn-next-month" title="다음 달">&gt;</button>
      <button class="btn-today-chip" id="btn-reset-today">오늘</button>
    </div>

    <div class="header-right">
      <button class="btn-header-add" id="btn-header-quick-add">+ 거래 입력</button>
    </div>
  </header>

  <!-- App Body Layout (Sidebar + Main Content) -->
  <div class="app-body">
    <!-- Desktop Left Sidebar -->
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="dashboard">
          <span class="nav-icon">🏠</span>
          <span class="nav-text">홈 대시보드</span>
        </button>
        <button class="nav-item" data-tab="transactions">
          <span class="nav-icon">💸</span>
          <span class="nav-text">거래 목록</span>
        </button>
        <button class="nav-item" data-tab="statistics">
          <span class="nav-icon">📊</span>
          <span class="nav-text">통계 분석</span>
        </button>
        <button class="nav-item" data-tab="goals">
          <span class="nav-icon">🎯</span>
          <span class="nav-text">재정 목표/계좌</span>
        </button>
        <button class="nav-item" data-tab="settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">설정/관리</span>
        </button>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-badge-row" id="sidebar-user-badges">
          <span>👨 남편</span>
          <span>·</span>
          <span>👩 아내</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="view-container" id="main-view-container">
        <!-- Rendered view content injects here dynamically -->
      </div>
    </main>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="b-nav-item active" data-tab="dashboard">
      <span class="b-nav-icon">🏠</span>
      <span class="b-nav-label">홈</span>
    </button>
    <button class="b-nav-item" data-tab="transactions">
      <span class="b-nav-icon">💸</span>
      <span class="b-nav-label">거래</span>
    </button>
    
    <!-- Floating Center Action Button -->
    <button class="b-nav-item fab-center-item" id="btn-fab-add">
      <div class="fab-circle">
        <span>➕</span>
      </div>
      <span class="b-nav-label">기록</span>
    </button>

    <button class="b-nav-item" data-tab="statistics">
      <span class="b-nav-icon">📊</span>
      <span class="b-nav-label">통계</span>
    </button>
    <button class="b-nav-item" data-tab="goals">
      <span class="b-nav-icon">🎯</span>
      <span class="b-nav-label">목표</span>
    </button>
    <button class="b-nav-item" data-tab="settings">
      <span class="b-nav-icon">⚙️</span>
      <span class="b-nav-label">설정</span>
    </button>
  </nav>

  <!-- Quick Entry & Edit Modal -->
  <div class="modal-overlay" id="transaction-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title-text">거래 등록</h3>
        <button class="btn-modal-close" id="modal-btn-close">&times;</button>
      </div>

      <div class="modal-body">
        <!-- 유형 -->
        <div class="modal-tabs">
          <button class="m-tab active" id="tab-modal-expense">지출</button>
          <button class="m-tab" id="tab-modal-income">수입</button>
          <button class="m-tab" id="tab-modal-transfer">이체</button>
        </div>

        <!-- 금액 -->
        <div class="form-group">
          <label class="form-label" for="modal-input-amount">얼마를 썼나요</label>
          <div class="amount-input-box">
            <input type="number" id="modal-input-amount" class="amount-field" placeholder="0" autofocus />
            <span class="currency-symbol">원</span>
          </div>
        </div>

        <!-- 카테고리 -->
        <div class="form-group margin-top-sm" id="modal-group-category">
          <label class="form-label">어떤 항목인가요</label>
          <div class="chips-grid" id="modal-category-grid"></div>
        </div>

        <!-- 누가 -->
        <div class="form-group margin-top-sm">
          <label class="form-label">누가 결제했나요</label>
          <div class="btn-group-row">
            <button class="btn-toggle active" id="modal-user-husband">남편</button>
            <button class="btn-toggle" id="modal-user-wife">아내</button>
          </div>
        </div>

        <!-- 공동 / 개인 -->
        <div class="form-group margin-top-sm">
          <label class="form-label">공동 지출인가요</label>
          <div class="btn-group-row">
            <button class="btn-toggle active" id="modal-shared-common">공동</button>
            <button class="btn-toggle" id="modal-shared-husband">남편 개인</button>
            <button class="btn-toggle" id="modal-shared-wife">아내 개인</button>
          </div>
        </div>

        <!-- 상세 펼치기 -->
        <button class="detail-toggle margin-top-sm" id="modal-detail-toggle"
                aria-expanded="false" aria-controls="modal-detail">
          <span class="detail-toggle-label">상세 입력</span>
          <span class="detail-toggle-summary" id="modal-detail-summary"></span>
          <svg class="detail-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <!-- 상세 -->
        <div class="detail-panel" id="modal-detail" hidden>
          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label" for="modal-input-date">거래 날짜</label>
              <input type="date" id="modal-input-date" class="form-input" />
            </div>
            <div class="form-group">
              <label class="form-label" for="modal-select-payment">결제 수단</label>
              <select id="modal-select-payment" class="form-select">
                <option value="card">신용/체크카드</option>
                <option value="bank">계좌이체</option>
                <option value="cash">현금</option>
              </select>
            </div>
          </div>

          <div class="form-group margin-top-sm" id="modal-group-account">
            <label class="form-label" for="modal-select-account">사용 계좌 (선택)</label>
            <select id="modal-select-account" class="form-select">
              <option value="">선택 안 함</option>
            </select>
          </div>

          <div class="form-group margin-top-sm" id="modal-group-transfer" style="display:none">
            <label class="form-label">이체 계좌</label>
            <div class="form-row-2">
              <select id="modal-select-from" class="form-select">
                <option value="">출금 계좌 선택</option>
              </select>
              <select id="modal-select-to" class="form-select">
                <option value="">입금 계좌 선택</option>
              </select>
            </div>
          </div>

          <div class="form-group margin-top-sm" id="modal-group-installment">
            <label class="form-label" for="modal-select-installment">할부</label>
            <div class="form-row-2">
              <select id="modal-select-installment" class="form-select">
                <option value="0">일시불</option>
                <option value="2">2개월</option>
                <option value="3">3개월</option>
                <option value="4">4개월</option>
                <option value="5">5개월</option>
                <option value="6">6개월</option>
                <option value="9">9개월</option>
                <option value="10">10개월</option>
                <option value="12">12개월</option>
                <option value="18">18개월</option>
                <option value="24">24개월</option>
                <option value="36">36개월</option>
              </select>
              <div class="rate-field" id="modal-rate-field" style="display:none">
                <input type="text" inputmode="decimal" id="modal-input-rate" class="form-input"
                       placeholder="0" value="0" />
                <span class="unit-text">% (연)</span>
              </div>
            </div>
            <div class="installment-preview" id="modal-installment-preview"></div>
          </div>

          <div class="form-group margin-top-sm" id="modal-group-fixed">
            <label class="form-label">지출 유형</label>
            <div class="btn-group-row">
              <button class="btn-toggle active" id="modal-btn-variable">변동지출</button>
              <button class="btn-toggle" id="modal-btn-fixed">고정지출</button>
            </div>
          </div>

          <div class="form-group margin-top-sm">
            <label class="form-label" for="modal-input-memo">메모</label>
            <input type="text" id="modal-input-memo" class="form-input" placeholder="예: 이마트 장보기" />
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" id="modal-btn-cancel">취소</button>
        <button class="btn-primary" id="modal-btn-save">저장하기</button>
      </div>
    </div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
